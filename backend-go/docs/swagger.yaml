basePath: /
definitions:
  model.DatabaseHealthResponse:
    properties:
      database:
        example: connected
        type: string
      status:
        example: ok
        type: string
    type: object
  model.HealthResponse:
    properties:
      status:
        example: ok
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: Backend API for TermtemSL Sign Language Application
  title: TermtemSL Backend API
  version: "1.0"
paths:
  /api/videos/upload:
    post:
      consumes:
      - multipart/form-data
      description: Accepts a multipart/form-data video upload and saves it to disk
      parameters:
      - description: Video file to upload (mp4, mov, avi, mkv)
        in: formData
        name: video
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: video uploaded successfully
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: bad request - no file or invalid type
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Upload a video file
      tags:
      - Videos
  /health:
    get:
      description: Check whether the backend server is running
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.HealthResponse'
      summary: Check API health
      tags:
      - Health
  /health/db:
    get:
      description: Check whether the backend can connect to PostgreSQL
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.DatabaseHealthResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/model.DatabaseHealthResponse'
      summary: Check database health
      tags:
      - Health
swagger: "2.0"
