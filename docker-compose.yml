services:
  backend-go:
    build:
      context: ./backend-go
      dockerfile: Dockerfile
    container_name: termtemsl-backend-go
    ports:
      - "8080:8080"
    volumes:
      # Named volumes keep uploaded and generated files across container restarts.
      - backend_uploads:/app/uploads
      - backend_outputs:/app/outputs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

# ── Named volumes ──────────────────────────────────────────────────────────────
# Persisted across container restarts during development.
# To wipe them:  docker compose down -v
volumes:
  backend_uploads:
  backend_outputs:

# ── Notes ──────────────────────────────────────────────────────────────────────
# Database, Redis, AI/model service, and Flutter are NOT included here.
# They will be added as separate services in a future iteration.
